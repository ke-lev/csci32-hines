name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # prisma only needs a syntactically valid URL to validate the schema; nothing connects
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn check-types

      - run: yarn test

      - run: yarn workspace @repo/database db:validate

      - run: yarn build
